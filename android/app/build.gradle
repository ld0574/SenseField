import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openkhub.sensefield'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.openkhub.sensefield'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.2.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

def minimapModelDir = file('src/main/assets')
def minimapModelMetadata = file("${minimapModelDir}/minimap-yolox-nano-320.metadata.json")

tasks.register('verifyMinimapModelAssets') {
    def param = file("${minimapModelDir}/minimap-yolox-nano-320.param")
    def weights = file("${minimapModelDir}/minimap-yolox-nano-320.bin")
    inputs.files(param, weights, minimapModelMetadata)
    doLast {
        def presentCount = [param, weights].count { it.isFile() }
        if (presentCount == 0) {
            logger.lifecycle('Private YOLOX assets are absent; building with the public default profile.')
            return
        }
        if (presentCount != 2) {
            throw new GradleException(
                    'YOLOX assets are incomplete. Place both minimap-yolox-nano-320.param '
                            + 'and minimap-yolox-nano-320.bin in app/src/main/assets, or remove both.'
            )
        }
        if (!minimapModelMetadata.isFile()) {
            throw new GradleException(
                    'YOLOX model metadata is missing; cannot verify local model hashes.'
            )
        }
        def metadata = new JsonSlurper().parse(minimapModelMetadata)
        [['param', param], ['bin', weights]].each { entry ->
            def expected = metadata.runtime["${entry[0]}_sha256"]
            def actual = MessageDigest.getInstance('SHA-256')
                    .digest(entry[1].bytes).encodeHex().toString()
            if (!(expected instanceof String) || actual != expected) {
                throw new GradleException("Minimap model ${entry[0]} SHA-256 mismatch: "
                        + "expected ${expected}, got ${actual}")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyMinimapModelAssets')
}
