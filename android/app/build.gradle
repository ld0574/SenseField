import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def releaseSigningInputs = [
    keystorePath: System.getenv('SENSEFIELD_KEYSTORE_PATH'),
    keyAlias: System.getenv('SENSEFIELD_KEY_ALIAS'),
    keystorePassword: System.getenv('SENSEFIELD_KEYSTORE_PASSWORD'),
    keyPassword: System.getenv('SENSEFIELD_KEY_PASSWORD')
]
def providedReleaseSigningInputs = releaseSigningInputs.findAll { name, value ->
    value != null && !value.trim().isEmpty()
}
if (!providedReleaseSigningInputs.isEmpty()
        && providedReleaseSigningInputs.size() != releaseSigningInputs.size()) {
    throw new GradleException(
            'Incomplete release signing configuration. Set all of '
                    + 'SENSEFIELD_KEYSTORE_PATH, SENSEFIELD_KEY_ALIAS, '
                    + 'SENSEFIELD_KEYSTORE_PASSWORD, and SENSEFIELD_KEY_PASSWORD, '
                    + 'or leave all four unset for a debug candidate.'
    )
}
def releaseSigningConfigured = providedReleaseSigningInputs.size() == releaseSigningInputs.size()
def speechFixture = (findProperty('sensefieldSpeechFixture') ?: 'false').toString() == 'true'
if (releaseSigningConfigured && !file(releaseSigningInputs.keystorePath).isFile()) {
    throw new GradleException(
            "SENSEFIELD_KEYSTORE_PATH does not point to a readable keystore: "
                    + releaseSigningInputs.keystorePath
    )
}

def updateMetadataUrl = (findProperty('sensefieldUpdateManifestUrl')
        ?: System.getenv('SENSEFIELD_UPDATE_MANIFEST_URL')
        ?: 'https://888413.xyz/apk/latest.json').toString().trim()
// Default to the user-selected CDN; HTTPS overrides support isolated update tests.
if (!updateMetadataUrl.isEmpty()) {
    def updateMetadataUri = new URI(updateMetadataUrl)
    if (updateMetadataUri.scheme != 'https' || !updateMetadataUri.host
            || updateMetadataUri.userInfo || updateMetadataUri.query || updateMetadataUri.fragment) {
        throw new GradleException('CDN update manifest must be an HTTPS URL without credentials, query or fragment.')
    }
}

def assistantEndpointInput = findProperty('sensefieldAssistantEndpoint')
if (assistantEndpointInput == null) {
    assistantEndpointInput = System.getenv('SENSEFIELD_ASSISTANT_ENDPOINT')
}
def assistantDefaultEndpoint = (assistantEndpointInput ?: 'https://sf.888413.xyz').toString().trim()
        .replaceAll('/+$', '')
if (!assistantDefaultEndpoint.isEmpty()) {
    try {
        def assistantEndpointUri = new URI(assistantDefaultEndpoint)
        if (!'https'.equalsIgnoreCase(assistantEndpointUri.scheme)
                || !assistantEndpointUri.host || assistantEndpointUri.userInfo != null
                || assistantEndpointUri.query != null || assistantEndpointUri.fragment != null
                || (assistantEndpointUri.path && assistantEndpointUri.path != '/')
                || assistantEndpointUri.port > 65535) {
            throw new GradleException(
                    'Assistant default endpoint must be an HTTPS host root without credentials, query or fragment.')
        }
    } catch (java.net.URISyntaxException invalidEndpoint) {
        throw new GradleException(
                'Assistant default endpoint must be an HTTPS host root without credentials, query or fragment.',
                invalidEndpoint)
    }
}

android {
    namespace 'com.openkhub.sensefield'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId speechFixture ? 'com.openkhub.sensefield.speechfixture' : 'com.openkhub.sensefield'
        minSdk 29
        targetSdk 35
        versionCode 21
        versionName '0.4.4'
        buildConfigField 'boolean', 'SPEECH_TEST_FIXTURE', speechFixture.toString()
        buildConfigField 'String', 'APP_UPDATE_METADATA_URL', groovy.json.JsonOutput.toJson(updateMetadataUrl)
        buildConfigField 'String', 'ASSISTANT_DEFAULT_ENDPOINT', groovy.json.JsonOutput.toJson(assistantDefaultEndpoint)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // 默认仅 arm64-v8a（真机）；构建模拟器变体用 -PsensefieldAbi=x86_64
            abiFilters ((findProperty('sensefieldAbi') ?: 'arm64-v8a').toString().split(',').collect { it.trim() } as String[])
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Opt-in regression inputs from a user-provided diagnostic archive. They
    // live in ignored output/, enter only the test APK, and are never shipped.
    def captureScaleFixtureDir = findProperty('sensefieldCaptureScaleFixtureDir')
    if (captureScaleFixtureDir != null) {
        sourceSets.androidTest.assets.srcDir(file(captureScaleFixtureDir.toString()))
    }

    androidResources {
        noCompress += ['ogg']
        // Keep licenses and metadata in the APK; pinned speech weights come from CDN.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:model.int8.onnx:tokens.txt'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigningInputs.keystorePath)
                storePassword releaseSigningInputs.keystorePassword
                keyAlias releaseSigningInputs.keyAlias
                keyPassword releaseSigningInputs.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFiles 'proguard-test-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
        dex.useLegacyPackaging = true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    testBuildType (findProperty('sensefieldTestBuildType') ?: 'debug').toString()
}

if (speechFixture) {
    if (file('src/main/assets/speech/manifest.json').exists()) {
        throw new GradleException('Real speech assets are present; test the real Release instead of synthetic fixtures.')
    }
    android.defaultConfig.versionName = '0.4.4-fixture'
    android.sourceSets.main.assets.srcDir file('../../output/speech-fixture/assets')
}

// Isolated upgrade tests build a future APK without changing the delivered version.
if (findProperty('sensefieldTestVersionCode') || findProperty('sensefieldTestVersionName')) {
    if (!findProperty('sensefieldTestVersionCode') || !findProperty('sensefieldTestVersionName')) {
        throw new GradleException('An upgrade fixture needs both test version properties.')
    }
    def fixtureCode = findProperty('sensefieldTestVersionCode').toString().toInteger()
    def fixtureName = findProperty('sensefieldTestVersionName').toString()
    if (fixtureCode <= android.defaultConfig.versionCode || !(fixtureName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
        throw new GradleException('The isolated upgrade fixture must use a future version.')
    }
    android.defaultConfig.versionCode = fixtureCode
    android.defaultConfig.versionName = fixtureName
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local JVM tests; use the real parser for recovery fixtures.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

def minimapModelDir = file('src/main/assets')
// The frozen 320 enemy-only baseline and the experimental dual-class
// near-zone model. Weights stay local; each tracked metadata sidecar pins them.
def minimapModelSets = ['minimap-yolox-nano-320', 'minimap-yolox-nano-dual-512']

tasks.register('verifyMinimapModelAssets') {
    minimapModelSets.each { stem ->
        inputs.files(file("${minimapModelDir}/${stem}.param"),
                file("${minimapModelDir}/${stem}.bin"),
                file("${minimapModelDir}/${stem}.metadata.json"))
    }
    doLast {
        minimapModelSets.each { stem ->
            def param = file("${minimapModelDir}/${stem}.param")
            def weights = file("${minimapModelDir}/${stem}.bin")
            def metadataFile = file("${minimapModelDir}/${stem}.metadata.json")
            def presentCount = [param, weights].count { it.isFile() }
            if (presentCount == 0) {
                logger.lifecycle("Private YOLOX assets ${stem} are absent; the profile bound to "
                        + 'them cannot run until matching model files are added.')
                return
            }
            if (presentCount != 2) {
                throw new GradleException(
                        "YOLOX assets are incomplete. Place both ${stem}.param "
                                + "and ${stem}.bin in app/src/main/assets, or remove both."
                )
            }
            if (!metadataFile.isFile()) {
                throw new GradleException(
                        "YOLOX model metadata ${stem}.metadata.json is missing; "
                                + 'cannot verify local model hashes.'
                )
            }
            def metadata = new JsonSlurper().parse(metadataFile)
            [['param', param], ['bin', weights]].each { entry ->
                def expected = metadata.runtime["${entry[0]}_sha256"]
                def actual = MessageDigest.getInstance('SHA-256')
                        .digest(entry[1].bytes).encodeHex().toString()
                if (!(expected instanceof String) || actual != expected) {
                    throw new GradleException("Minimap model ${stem} ${entry[0]} SHA-256 "
                            + "mismatch: expected ${expected}, got ${actual}")
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyMinimapModelAssets')
}

tasks.register('verifyOnDeviceAsrAssets') {
    def directory = file('src/main/assets/sensevoice')
    def metadataFile = file('src/main/assets/sensevoice.metadata.json')
    inputs.files(metadataFile, file("${directory}/model.int8.onnx"), file("${directory}/tokens.txt"))
    doLast {
        def files = ['model.int8.onnx', 'tokens.txt'].collect { file("${directory}/${it}") }
        if (files.every { !it.isFile() }) {
            logger.lifecycle('Local ASR assets are absent; continuous voice will report unavailable without cloud fallback.')
            return
        }
        if (files.any { !it.isFile() } || !metadataFile.isFile()) {
            throw new GradleException('Local ASR requires both pinned model/tokens and sensevoice.metadata.json.')
        }
        def metadata = new JsonSlurper().parse(metadataFile)
        files.each { asset ->
            def expected = metadata.files[asset.name]
            def digest = MessageDigest.getInstance('SHA-256')
            asset.withInputStream { stream ->
                byte[] block = new byte[65536]
                int count
                while ((count = stream.read(block)) != -1) digest.update(block, 0, count)
            }
            if (!expected || asset.length() != expected.size
                    || digest.digest().encodeHex().toString() != expected.sha256) {
                throw new GradleException("Local ASR asset ${asset.name} does not match its pinned manifest.")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyOnDeviceAsrAssets')
}

tasks.register('verifyBundledSpeechAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    def args = ['python3', 'scripts/prepare_bundled_speech.py', 'verify']
    if (speechFixture) args += ['--destination', 'output/speech-fixture/assets/speech', '--allow-fixture']
    commandLine args
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyBundledSpeechAssets')
}
