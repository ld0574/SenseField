# Merge this location into the existing sf.888413.xyz HTTPS server block.
# Keep the existing site's certificates, other locations and process settings.
# proxy_pass must use the same upstream protocol/port as the working /health route.
# Apply these guards to every site whose root/alias exposes /data/wwwroot/sf.
location = /game-models { return 404; }
location ^~ /game-models/ { return 404; }

location /v1/game-models/ {
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-SenseField-Installation $http_x_sensefield_installation;
    proxy_set_header Range $http_range;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
