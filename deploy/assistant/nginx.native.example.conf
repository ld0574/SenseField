# Native local-proxy transport. The public HTTPS certificate terminates at
# Nginx; only loopback HTTP connects to the gateway. Include these zones in
# nginx's http block.
limit_req_zone $binary_remote_addr zone=sf_requests:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=sf_connections:1m;

server {
    listen 443 ssl;
    server_name sf.888413.xyz;
    # Adjust these to the public certificate paths provided by your host/panel.
    ssl_certificate /etc/letsencrypt/live/sf.888413.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sf.888413.xyz/privkey.pem;
    proxy_connect_timeout 2s;
    proxy_read_timeout 21s;
    proxy_send_timeout 5s;
    access_log off;
    client_max_body_size 3m;

    location = /health {
        proxy_pass http://127.0.0.1:18765;
    }
    location = /v1/visual {
        limit_req zone=sf_requests burst=3 nodelay;
        limit_req_status 429;
        limit_conn sf_connections 3;
        limit_conn_status 429;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:18765;
    }
    location / { return 404; }
}
