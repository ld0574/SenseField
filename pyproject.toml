[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mapassist-replay"
version = "0.1.0"
description = "Local replay and event evaluation for a low-vision game assistant"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
assistant-gateway = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "websockets==15.0.1",
    "httpx==0.28.1",
    "funasr==1.4.16",
    "modelscope==1.40.1",
    "huggingface-hub==0.36.0",
    "transformers==4.57.6",
    "torch==2.8.0+cpu; sys_platform == 'linux'",
    "torch==2.8.0; sys_platform != 'linux'",
    "kaldi-native-fbank==1.22.3",
]
assistant-vision-gateway = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "websockets==15.0.1",
    "httpx==0.28.1",
]
assistant-gateway-test = [
    "pytest>=8,<10",
    "fastapi==0.142.2",
    "websockets==15.0.1",
    "httpx==0.28.1",
]
assistant-asr-sensevoice = ["sherpa-onnx==1.13.8"]

[project.scripts]
mapassist-replay = "mapassist.replay:main"
mapassist-evaluate = "mapassist.evaluate:main"
mapassist-synthetic = "mapassist.synthetic:main"
mapassist-synthetic-android = "mapassist.synthetic_android:main"
mapassist-bundle-profile = "mapassist.bundle_profile:main"
mapassist-extract-frame = "mapassist.extract_frame:main"
mapassist-detection-dataset = "mapassist.detection_dataset:main"
mapassist-detection-evaluate = "mapassist.detection_evaluate:main"
mapassist-detection-replay-evaluate = "mapassist.detection_replay_evaluate:main"
mapassist-merge-detection-manifests = "mapassist.merge_detection_manifests:main"
mapassist-review-dataset = "mapassist.review_dataset:main"
mapassist-blind-review-dataset = "mapassist.blind_review_dataset:main"
mapassist-finalize-review = "mapassist.finalize_review:main"
mapassist-apply-label-shards = "mapassist.apply_label_shards:main"
mapassist-combine-detection-manifests = "mapassist.combine_detection_manifests:main"
mapassist-annotation-server = "mapassist.annotation_server:main"
mapassist-measure-latency = "mapassist.measure_latency:main"
mapassist-measure-assistant-latency = "mapassist.measure_assistant_latency:main"
mapassist-validation-gate = "mapassist.validation_gate:main"
mapassist-android-session-log = "mapassist.android_session_log:main"
mapassist-diagnostic-report = "mapassist.diagnostic_report:main"
mapassist-diagnostic-compare = "mapassist.diagnostic_compare:main"
mapassist-calibrate-minimap-anchor = "mapassist.calibrate_minimap_anchor:main"
mapassist-evaluate-minimap-locator = "mapassist.minimap_locator_evaluate:main"
mapassist-audit-coco-dataset = "mapassist.coco_dataset_audit:main"
mapassist-prepare-external-minimap = "mapassist.prepare_external_minimap:main"
mapassist-safe-roi-manifest = "mapassist.safe_roi_manifest:main"
mapassist-assistant-gateway = "mapassist.assistant_gateway.cli:main"
mapassist-assistant-gateway-download-model = "mapassist.assistant_gateway.download_model:main"
mapassist-assistant-gateway-smoke = "mapassist.assistant_gateway.smoke:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
mapassist = ["annotation_web/*.html", "annotation_web/*.css", "annotation_web/*.js", "annotation_web/*.png", "assistant_gateway/*.json"]
